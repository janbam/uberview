[package]
name = "uberview"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
ignore = "0.4.25"
rayon = "1.11.0"
tree-sitter = "0.26.7"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.1"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"
